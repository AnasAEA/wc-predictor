name: Health check

# Always-on watchdog for the LIVE site: is it up, is the data valid, are live scores fresh, do assets load?
# Runs ~twice an hour (GitHub may delay scheduled runs), and on demand. On failure it opens/updates a single
# GitHub issue (labelled `health`) so you get a notification; on recovery it comments + closes it.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: run
        run: |
          set +e
          node scripts/health-check.mjs > health.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat health.txt
      - name: Open / update issue on failure
        if: ${{ steps.run.outputs.rc != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create health --color B60205 --description "Automated health watchdog" 2>/dev/null || true
          n=$(gh issue list --label health --state open --json number -q '.[0].number')
          body=$'Automated health check **failed** at '"$(date -u +'%Y-%m-%d %H:%M UTC')"$'.\n\n```\n'"$(cat health.txt)"$'\n```\n\n([logs]('"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'))'
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "⚠️ Site health check failing" --label health --body "$body"
          fi
      - name: Comment + close issue on recovery
        if: ${{ steps.run.outputs.rc == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label health --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "✓ Recovered — health check passing at $(date -u +'%Y-%m-%d %H:%M UTC')."
            gh issue close "$n"
          fi
