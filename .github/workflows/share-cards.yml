name: Share cards

# Generates per-match OG share cards (assets/og/*.png + share/*.html). Runs after each
# scores update — isolated from the dependency-free scores pipeline so npm never touches it.
on:
  workflow_run:
    workflows: ["Update scores"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    # Only after a scores run that actually finished its work — not on cancelled/failed runs (the loop is often
    # replaced mid-flight), so we don't fire npm ci + satori for nothing.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Generate share cards
        run: node scripts/make-share-cards.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/og share)" ]; then
            git config user.name "wc26-bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/og share
            git commit -m "share cards: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No new cards."
          fi
